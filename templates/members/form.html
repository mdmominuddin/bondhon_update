{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-3xl">
  {% if intro %}<p class="mb-4 text-sm text-stone-600">{{ intro }}</p>{% endif %}
  <form method="post" class="card card-body">{% csrf_token %}
    {% include "components/form.html" with form=form %}
    <div class="mt-6 flex gap-3"><button class="btn-primary">Save</button><a href="{% url cancel|default:'home' %}" class="btn-secondary">Cancel</a></div>
  </form>
</div>
{% endblock %}
