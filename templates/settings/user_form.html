{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl"><form method="post" class="card card-body">{% csrf_token %}
  {% include "components/form.html" with form=form %}
  <div class="mt-6 flex gap-3"><button class="btn-primary">Save</button><a href="{% url 'user_list' %}" class="btn-secondary">Cancel</a></div></form>
  <p class="mt-3 text-xs text-stone-500">New users receive a temporary password (shown once after saving). Linking a member gives that person the Member portal.</p></div>
{% endblock %}
