{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg">
  {% if forced %}<div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900">For your security, please choose a new password before continuing.</div>{% endif %}
  <div class="card card-body">
    <form method="post" class="space-y-4">{% csrf_token %}
      {% include "components/form.html" with form=form cols=1 %}
      <button class="btn-primary">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
